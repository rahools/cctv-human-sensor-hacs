[project]
name = "cctv-human-sensor-hacs"
version = "0.0.1"
description = "Hunch human-detection server and Home Assistant integration"
requires-python = ">=3.14.2,<3.15"
dependencies = ["hunch-cctv-server"]

[dependency-groups]
dev = [
  "homeassistant==2026.10.0",
  "mypy",
  "numpy",
  "pillow",
  "pre-commit",
  "ruff",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["server"]

[tool.uv.sources]
hunch-cctv-server = { workspace = true }

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "hunch_cctv"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
