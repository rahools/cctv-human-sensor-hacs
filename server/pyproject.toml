[project]
name = "hunch-cctv-server"
version = "0.0.2"
description = "Minimal HTTP human-detection service powered by hunch.live"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.12",
  "huggingface-hub==0.30.2",
  "uvicorn==0.34.2",
]

[project.optional-dependencies]
hunch = ["eg2cpu", "hunch"]

[tool.uv.sources]
eg2cpu = { git = "https://github.com/undrgrnd-labs/hunch.git", rev = "22cf73010b0d399894068b1b9d21c5e4101514b6", subdirectory = "eg2cpu" }
hunch = { git = "https://github.com/undrgrnd-labs/hunch.git", rev = "22cf73010b0d399894068b1b9d21c5e4101514b6", subdirectory = "hunch" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hunch_cctv"]
